# A schema for kitty.conf's *static* settings (font, scrollback, shell,
# window size, remote control, ...) — deliberately NOT the whole file.
# kitty's `kitten themes` tool rewrites a BEGIN_KITTY_THEME/END_KITTY_THEME
# block in the live kitty.conf on every `chtheme()`; a ConfigFile Sweep
# (~5s) would clobber that if it owned the whole file. kitty.conf instead
# stays a thin, hand-managed stub with `include tauler-kitty-settings.conf`
# ahead of that block — this schema covers only the included file.
#
# Grammar for every directive below was checked against the shipped
# reference config at /usr/share/doc/kitty/kitty.conf (kitty 0.48.2), not
# guessed — where that reference didn't have a value grammar to check
# (mainly boolean/enum directives), the plain-English description there was
# used to write the pattern/enum.
#
# Note: `adjust_line_height` (used in the real deployed config) is marked
# deprecated in 0.48.2 in favor of `modify_font` — kept as-is here since
# migrating to the replacement option is a separate decision, not part of
# porting the existing settings into tauler.
#
# Every leaf component's constant is named `directive` (not `css_name`,
# rofi's choice) — this schema shares zero Rust code or vocabulary with
# rofi-full-theme.schema.yaml, which is the actual proof the underlying
# system is format-independent, not just theoretically so.
nodes:
  - component: KittySettings
    root: true
    container: true
    children_as: settings

  - component: FontFamily
    props:
      value: { pattern: '^.+$' }
    constants: { directive: font_family }

  - component: BoldFont
    props:
      value: { pattern: '^.+$' }
    constants: { directive: bold_font }

  - component: ItalicFont
    props:
      value: { pattern: '^.+$' }
    constants: { directive: italic_font }

  - component: BoldItalicFont
    props:
      value: { pattern: '^.+$' }
    constants: { directive: bold_italic_font }

  # Deprecated in kitty 0.48.2 (favor of `modify_font`) but kept as a
  # faithful port of the real deployed config — see header comment.
  - component: AdjustLineHeight
    props:
      value: { pattern: '^[0-9]+%?$' }
    constants: { directive: adjust_line_height }

  - component: FontSize
    props:
      value: { pattern: '^[0-9]+(\.[0-9]+)?$' }
    constants: { directive: font_size }

  - component: AutoReloadConfig
    props:
      # Seconds to debounce before reload; negative disables it.
      value: { pattern: '^-?[0-9]+(\.[0-9]+)?$' }
    constants: { directive: auto_reload_config }

  - component: ProgressBar
    props:
      value: { enum: ["left", "right", "top", "bottom", "hidden"] }
    constants: { directive: progress_bar }

  - component: ScrollbackLines
    props:
      # Negative is (effectively) infinite scrollback, per the reference doc.
      value: { pattern: '^-?[0-9]+$' }
    constants: { directive: scrollback_lines }

  - component: EnableAudioBell
    props:
      value: { enum: ["yes", "no"] }
    constants: { directive: enable_audio_bell }

  - component: ShellIntegration
    props:
      value:
        pattern: '^(enabled|disabled|(no-rc|no-cursor|no-title|no-cwd|no-prompt-mark|no-complete|no-sudo)( (no-rc|no-cursor|no-title|no-cwd|no-prompt-mark|no-complete|no-sudo))*)$'
        error: 'must be "enabled", "disabled", or a space-separated list of no-rc/no-cursor/no-title/no-cwd/no-prompt-mark/no-complete/no-sudo'
    constants: { directive: shell_integration }

  - component: Shell
    props:
      # ". " (default: $SHELL) or an arbitrary command; env vars expand.
      value: { pattern: '^.+$' }
    constants: { directive: shell }

  - component: RememberWindowSize
    props:
      value: { enum: ["yes", "no"] }
    constants: { directive: remember_window_size }

  - component: InitialWindowWidth
    props:
      # Pixels, or an integer with a trailing "c" for cells.
      value: { pattern: '^[0-9]+c?$' }
    constants: { directive: initial_window_width }

  - component: InitialWindowHeight
    props:
      value: { pattern: '^[0-9]+c?$' }
    constants: { directive: initial_window_height }

  - component: InactiveTextAlpha
    props:
      # Must be a number between -1 and 1 per the reference doc.
      value:
        pattern: '^-?(0(\.[0-9]+)?|1(\.0+)?)$'
        error: 'must be a number between -1 and 1'
    constants: { directive: inactive_text_alpha }

  - component: RepaintDelay
    props:
      value: { pattern: '^[0-9]+$' }
    constants: { directive: repaint_delay }

  - component: InputDelay
    props:
      value: { pattern: '^[0-9]+$' }
    constants: { directive: input_delay }

  - component: AllowRemoteControl
    props:
      value: { enum: ["password", "socket-only", "socket", "no", "yes"] }
    constants: { directive: allow_remote_control }
---
template: |
  # GENERATED by tauler from kitty-config.schema.yaml — do not edit by hand,
  # edit ~/.config/tauler/layout.op.mdx instead. Included from kitty.conf,
  # which stays a thin stub so `kitten themes` can keep rewriting its own
  # BEGIN_KITTY_THEME block undisturbed.
  {% for setting in settings %}
  {{ setting.directive }} {{ setting.value }}
  {%- endfor %}
