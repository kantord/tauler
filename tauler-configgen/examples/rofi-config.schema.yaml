# A schema for rofi's `configuration { }` block (behavior — modes, matching,
# terminal, display formats — not styling; the theme lives in
# rofi-full-theme.schema.yaml) plus the trailing `@theme "theme"` directive.
#
# A flat, non-selector settings block gets the same schema treatment as any
# other node shape — "no repeated structure to factor out" is not, on its
# own, a reason to skip validation; kitty-config.schema.yaml's equally flat
# settings block is proof this generalizes. (An earlier hand-written
# RofiConfig.jsx template literal claimed the opposite as its rationale;
# this schema replaced it once that rationale didn't hold up.)
#
# Grammar checked against `man rofi` (the `-modes`/`-matching`/`-sort`/etc.
# CLI options this maps to 1:1), not guessed. `quoted` marks the string-
# valued settings (rofi's config.rasi quotes strings but not booleans) —
# same convention as Font/Placeholder in rofi-full-theme.schema.yaml.
#
# The constant is named `css_name`, matching rofi-full-theme.schema.yaml —
# both schemas target the same program's config syntax, so they share one
# rofi-specific vocabulary. kitty-config.schema.yaml deliberately uses a
# *different* name (`directive`) for the same role: a schema's constant
# names are local to that schema and free-text by design (the crate itself
# assigns no meaning to them), and two schemas targeting the same config
# format is exactly the case where matching your own sibling, not an
# unrelated program's schema, is the useful consistency.
nodes:
  - component: RofiConfiguration
    root: true
    container: true
    children_as: settings

  - component: Modes
    props:
      # Comma-separated mode names (drun, run, window, combi, ...).
      value: { pattern: '^[a-zA-Z0-9_-]+(,[a-zA-Z0-9_-]+)*$' }
    constants: { css_name: modes, quoted: "true" }

  - component: CombiModes
    props:
      value: { pattern: '^[a-zA-Z0-9_-]+(,[a-zA-Z0-9_-]+)*$' }
    constants: { css_name: combi-modes, quoted: "true" }

  - component: Matching
    props:
      value:
        pattern: '^(normal|regex|glob|fuzzy|prefix)(,(normal|regex|glob|fuzzy|prefix))*$'
        error: 'must be one or more of normal/regex/glob/fuzzy/prefix, comma-separated'
    constants: { css_name: matching, quoted: "true" }

  - component: Sort
    props:
      value: { enum: ["true", "false"] }
    constants: { css_name: sort }

  - component: ShowIcons
    props:
      value: { enum: ["true", "false"] }
    constants: { css_name: show-icons }

  - component: Terminal
    props:
      value: { pattern: '^.+$' }
    constants: { css_name: terminal, quoted: "true" }

  - component: WindowFormat
    props:
      # A format string with rofi's window-mode placeholders (e.g. {c}).
      value: { pattern: '^.+$' }
    constants: { css_name: window-format, quoted: "true" }

  - component: DrunDisplayFormat
    props:
      value: { pattern: '^.+$' }
    constants: { css_name: drun-display-format, quoted: "true" }

  - component: DrunShowActions
    props:
      value: { enum: ["true", "false"] }
    constants: { css_name: drun-show-actions }

  - component: DrunMatchFields
    props:
      value: { pattern: '^[a-zA-Z0-9_-]+(,[a-zA-Z0-9_-]+)*$' }
    constants: { css_name: drun-match-fields, quoted: "true" }

  - component: DrunExcludeCategories
    props:
      value: { pattern: '^[a-zA-Z0-9_.-]+(;[a-zA-Z0-9_.-]+)*$' }
    constants: { css_name: drun-exclude-categories, quoted: "true" }

  - component: DisplayDrun
    props:
      value: { pattern: '^.+$' }
    constants: { css_name: display-drun, quoted: "true" }

  - component: DisplayRun
    props:
      value: { pattern: '^.+$' }
    constants: { css_name: display-run, quoted: "true" }

  - component: DisplayWindow
    props:
      value: { pattern: '^.+$' }
    constants: { css_name: display-window, quoted: "true" }

  - component: DisplayCombi
    props:
      value: { pattern: '^.+$' }
    constants: { css_name: display-combi, quoted: "true" }

  - component: ClickToExit
    props:
      value: { enum: ["true", "false"] }
    constants: { css_name: click-to-exit }
---
template: |
  /* GENERATED by tauler from rofi-config.schema.yaml — do not edit by hand,
   * edit ~/.config/tauler/layout.op.mdx instead. */

  configuration {
  {%- for setting in settings %}
  {%- if setting.quoted %}
      {{ setting.css_name }}: "{{ setting.value }}";
  {%- else %}
      {{ setting.css_name }}: {{ setting.value }};
  {%- endif %}
  {%- endfor %}
  }

  @theme "theme"
