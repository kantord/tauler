[package]
name = "tauler-configgen"
description = "Generates readable JSX marker components from a config-format schema; a runtime dependency of the shipped tauler binary via SchemaAwareLoader"
edition = "2021"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
jsonschema = { version = "0.57.0", default-features = false }
minijinja = "2.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.20"

[dev-dependencies]
regex = "1.13.1"
