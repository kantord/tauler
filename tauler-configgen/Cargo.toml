[package]
name = "tauler-configgen"
description = "Prototype: generate readable JSX marker components from a config-format schema (design record, not yet part of the shipped bar)"
edition = "2021"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
jsonschema = { version = "0.56.0", default-features = false }
minijinja = "2.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.20"
