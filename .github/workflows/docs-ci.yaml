name: Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-ci.yaml"
      # The site loads a wasm module built from these — see the "Build the
      # browser assets" step below, which mirrors deploy-docs.yaml's path
      # filters for the same reason: a change here changes what a test that
      # imports /tauler/*.js actually exercises.
      - "tauler-core/**"
      - "tauler-web/**"
      - "tauler-ui-macro/**"
      - "tauler-docgen/**"
      - "tauler-screenshot/**"
      - "assets/fonts/**"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-ci.yaml"
      - "tauler-core/**"
      - "tauler-web/**"
      - "tauler-ui-macro/**"
      - "tauler-docgen/**"
      - "tauler-screenshot/**"
      - "assets/fonts/**"
      - "Cargo.lock"

jobs:
  test:
    runs-on: ubuntu-latest
    # Font hinting and antialiasing differ enough across host OSes that a
    # bare `ubuntu-latest` runner and a matching-looking local environment
    # can each render the same page a few hundred pixels apart (ADR 0031).
    # Pinning the job to this exact image — the same one
    # docs/scripts/update-snapshots.sh runs locally — makes CI and every
    # contributor's machine the same environment instead of merely similar
    # ones. Bump together with @playwright/test; renovate.json groups them.
    container: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docs/public/tauler/*.js and the wasm module are gitignored build
      # products (ADR 0024) — nothing in this checkout produces them without
      # this. Without it, every test that awaits a dynamic import from
      # /tauler/ (docs/tests/units.spec.ts) hard-fails on a missing module
      # rather than exercising anything; other tests that merely attempt one
      # inside a try/catch (DemoColumn's own boot) fail silently instead,
      # which is what let this gap go unnoticed. Mirrors deploy-docs.yaml's
      # "Build the browser assets" step — same toolchain, same recipe.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig-dev libxcb1-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-ci-${{ hashFiles('**/Cargo.lock') }}

      # Pinned to the `wasm-bindgen` dependency in tauler-core/Cargo.toml: the CLI refuses
      # to process a module built against a different version of its own crate.
      - name: Install wasm-bindgen-cli
        working-directory: .
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: docs/package.json

      - name: Build the browser assets
        working-directory: .
        run: just docs

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run check
      - run: pnpm exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: docs/test-results/
