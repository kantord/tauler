name: Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-ci.yaml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-ci.yaml"
  # Font hinting and antialiasing differ enough across host OSes that
  # visual-regression baselines generated anywhere but this exact runner
  # (a dev machine, even a matching mcr.microsoft.com/playwright image)
  # can fail here by hundreds of pixels with no real content change. This
  # mode regenerates them on the one machine that gets to be authoritative.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate visual-regression baselines instead of checking them"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: ${{ !inputs.update_snapshots }}
        run: pnpm run format:check
      - if: ${{ !inputs.update_snapshots }}
        run: pnpm run check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        env:
          CI: "true"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: docs/test-results/
      - uses: actions/upload-artifact@v6
        if: ${{ inputs.update_snapshots }}
        with:
          name: updated-snapshots
          path: docs/tests/landing.spec.ts-snapshots/
