name: Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-ci.yaml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-ci.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    # Font hinting and antialiasing differ enough across host OSes that a
    # bare `ubuntu-latest` runner and a matching-looking local environment
    # can each render the same page a few hundred pixels apart (ADR 0031).
    # Pinning the job to this exact image — the same one
    # docs/scripts/update-snapshots.sh runs locally — makes CI and every
    # contributor's machine the same environment instead of merely similar
    # ones. Bump together with @playwright/test; renovate.json groups them.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: docs/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run check
      - run: pnpm exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: docs/test-results/
