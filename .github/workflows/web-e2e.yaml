name: Web renderer

# The DOM renderer against a pinned browser, compared with takumi node by node.
#
# Separate from `Desktop screenshots` because it shares nothing with it: no X server, no
# i3, no container that compiles tauler. What it does share is the arrangement — a browser
# whose version is fixed by an image, for the reason ADR 0004 gives about glibc and ADR
# 0026 repeats about Skia.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig-dev libxcb1-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-web-e2e-${{ hashFiles('**/Cargo.lock') }}

      # Pinned to the `wasm-bindgen` dependency in tauler-core/Cargo.toml.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      # Builds the wasm module, the browser assets, the stylesheet and the site; starts the
      # pinned browser; runs the scenarios against it.
      - name: Run the web scenarios
        run: just web-e2e

      # The fine-grained difference goes in front of a person rather than into a threshold
      # — ADR 0005's arrangement, which ADR 0026 keeps. These are published whatever the
      # outcome, because a passing run is exactly when nobody would otherwise look.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-renderer-shots
          path: docs/.tauler/web-shots/
