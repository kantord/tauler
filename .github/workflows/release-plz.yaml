name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'kantord' }}
    permissions:
      contents: write
    # Deliberately no `concurrency` block, per the official workflow
    # (https://release-plz.dev/docs/github/quickstart): GitHub keeps only the newest
    # pending run per group and cancels the rest, and a cancelled run here is a
    # skipped release. The docs put concurrency on the PR job only, as below.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig-dev libxcb1-dev pkg-config
      - name: Create git tags and GitHub releases
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish to crates.io
        run: |
          set -o pipefail
          order=$(cargo metadata --format-version 1 | jq -r '
            . as $m
            | [ $m.workspace_members[] as $id
                | $m.packages[] | select(.id == $id) | select(.publish != []) | .name ] as $ws
            | $m.packages[]
            | select(.name as $n | $ws | index($n))
            | . as $p
            | "\($p.name) \($p.name)",
              # Dev-dependencies do not gate publishing, and a dev-dep pointing back
              # at its own dependent (crate <-> its test helper, say) would read as a
              # cycle and make `tsort` emit a partial order without failing the step.
              (.dependencies[] | select(.kind != "dev")
                | select(.name as $d | $ws | index($d)) | "\(.name) \($p.name)")
          ' | tsort)
          for pkg in $order; do
            echo "Publishing $pkg..."
            if cargo publish -p "$pkg" 2>&1 | tee /tmp/publish.log; then
              continue
            fi
            if grep -q 'already exists on crates.io' /tmp/publish.log; then
              echo "$pkg already published, skipping."
            else
              echo "$pkg failed to publish."
              exit 1
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    needs:
      - release-plz-release
    # `needs` orders this after the release job, but deliberately does not gate on it
    # succeeding. A publish failure is very often fixable only by the next version --
    # a stale published dependency that a bump would resolve, say -- and gating here
    # meant the one job that opens that bump's PR could never run. Ordering is what is
    # wanted; a hard dependency was a deadlock.
    if: ${{ always() && github.repository_owner == 'kantord' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The fixup step below pushes to the release branch. A PAT, not the
          # default GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not start
          # workflow runs, so the release PR would keep showing the failed CI
          # from the commit the fixup corrects.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - name: Run release-plz release-pr
        id: release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # release-plz rewrites a path dependency's version requirement only for the
      # crates it releases, but `version.workspace = true` bumps every member. Any
      # cycle where a sibling crate has no commits of its own therefore produces a
      # release PR that fails `workspace_manifests_test`. Correct it in place rather
      # than by hand on every such PR.
      - name: Sync intra-workspace version requirements
        if: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch != '' }}
        env:
          HEAD_BRANCH: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout "$HEAD_BRANCH"
          ./scripts/sync-workspace-versions.sh
          if git diff --quiet; then
            echo "Version requirements already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync intra-workspace version requirements"
          git push origin "$HEAD_BRANCH"
