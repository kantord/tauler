name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'kantord' }}
    permissions:
      contents: write
      # crates.io trusted publishing: release-plz exchanges the job's OIDC token for
      # a 30-minute crates.io token. Each crate needs a trusted publisher configured
      # on crates.io (repo kantord/tauler, workflow release-plz.yaml), and a crate's
      # very first version must be published by hand.
      id-token: write
    # Deliberately no `concurrency` block, per the official workflow
    # (https://release-plz.dev/docs/github/quickstart): GitHub keeps only the newest
    # pending run per group and cancels the rest, and a cancelled run here is a
    # skipped release. The docs put concurrency on the PR job only, as below.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig-dev libxcb1-dev pkg-config
      # Per crate, in dependency order: publish to crates.io, then tag, then create
      # the GitHub release (which starts binary-release.yaml).
      #
      # If a crate uploads but its tag or release then fails (an expired
      # RELEASE_PLZ_TOKEN, say), later runs see it on crates.io and never tag it
      # (release-plz/release-plz#2578), so its binaries never build. Recover by hand
      # from your own `gh` login (not GITHUB_TOKEN, whose releases start no workflows):
      #   gh release create <crate>-v<version> --target <sha of the release commit>
      - name: Publish, tag and create GitHub releases
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5
        with:
          command: release
        # No CARGO_REGISTRY_TOKEN, not even an empty one: release-plz falls back to
        # trusted publishing only when that variable is absent.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    needs:
      - release-plz-release
    # `needs` orders this after the release job, but deliberately does not gate on it
    # succeeding. A publish failure is very often fixable only by the next version --
    # a stale published dependency that a bump would resolve, say -- and gating here
    # meant the one job that opens that bump's PR could never run. Ordering is what is
    # wanted; a hard dependency was a deadlock.
    if: ${{ always() && github.repository_owner == 'kantord' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Runs before checkout, deliberately: the checkout step below persists a
      # repo-write PAT to disk (needed for the push in the fixup step further
      # down), and apt installing from the Ubuntu archive runs postinst
      # scripts as root. Installing system deps first keeps that install off
      # the same disk state as a live write credential.
      #
      # release-pr runs cargo-semver-checks when it finds a version-relevant diff,
      # which builds rustdoc for the whole workspace -- a real compile, needing the
      # same system libs the other jobs install. This job skipped that step for a
      # long time because it rarely hit that code path; #539 did.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig-dev libxcb1-dev pkg-config
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The fixup step below pushes to the release branch. A PAT, not the
          # default GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not start
          # workflow runs, so the release PR would keep showing the failed CI
          # from the commit the fixup corrects.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
      - name: Run release-plz release-pr
        id: release-pr
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5
        with:
          command: release-pr
        # No CARGO_REGISTRY_TOKEN: release-pr only reads from crates.io, which needs
        # no token, and cargo-semver-checks compiles every dependency's build script
        # in this step -- a publish credential here would be reachable by all of them.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # release-plz rewrites a path dependency's version requirement only for the
      # crates it releases, but `version.workspace = true` bumps every member. Any
      # cycle where a sibling crate has no commits of its own therefore produces a
      # release PR that fails `workspace_manifests_test`. Correct it in place rather
      # than by hand on every such PR.
      #
      # `steps.release-pr.outputs.pr` is a JSON string, or empty when the previous
      # step didn't get far enough to open a PR (e.g. it hit
      # release-plz/release-plz#2878). Parsing happens in bash, not a YAML `fromJSON`
      # expression: a step's `env:` block evaluates before its `if:` is checked, so a
      # `fromJSON('')` there throws regardless of any `if:` guard on the step -- which
      # is exactly what took this step down the day it was written to fix the case
      # above.
      - name: Sync intra-workspace version requirements
        env:
          RELEASE_PR_JSON: ${{ steps.release-pr.outputs.pr }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PR_JSON:-}" ]; then
            echo "release-pr produced no output; nothing to sync."
            exit 0
          fi
          head_branch=$(printf '%s' "$RELEASE_PR_JSON" | jq -r '.head_branch // empty')
          if [ -z "$head_branch" ]; then
            echo "release-pr output had no head_branch; nothing to sync."
            exit 0
          fi
          git fetch origin "$head_branch"
          git checkout "$head_branch"
          ./scripts/sync-workspace-versions.sh
          if git diff --quiet; then
            echo "Version requirements already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync intra-workspace version requirements"
          git push origin "$head_branch"
