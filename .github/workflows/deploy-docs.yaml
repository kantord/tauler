name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yaml"
      # The site now carries a wasm module built from these. Narrow on purpose: a change
      # anywhere else in the workspace cannot alter what the browser loads, and widening
      # this to the whole tree would redeploy the docs on every Rust commit.
      - "tauler-core/**"
      - "tauler-web/**"
      - "tauler-ui-macro/**"
      - "tauler-docgen/**"
      - "tauler-screenshot/**"
      - "assets/fonts/**"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The browser assets are build products, not commits — see ADR 0024's consequences
      # and the `.gitignore` entry. That is what puts a Rust toolchain in a docs deploy.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig-dev libxcb1-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      # Pinned to the `wasm-bindgen` dependency in tauler-core/Cargo.toml: the CLI refuses
      # to process a module built against a different version of its own crate.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # `packageManager` lives in docs/package.json; there is no root package.json, and
      # without pointing at it the action fails with "No pnpm version is specified".
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: docs/package.json

      # Generates the component page, the screenshots, the `@ui/*` modules, the examples,
      # the harvested class list and the wasm module, then compiles the stylesheet.
      - name: Build the browser assets
        run: just docs

      - uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          path: docs
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
