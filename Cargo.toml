[workspace]
members = [".", "tauler-core", "tauler-web", "tauler-i3", "tauler-aerospace", "tauler-notify", "tauler-ui-macro", "tauler-docgen", "tauler-screenshot", "tauler-accumulate", "tauler-e2e", "tauler-web-e2e", "tauler-configgen", "taulerbox"]
resolver = "2"

[workspace.package]
version = "0.7.2"
authors = ["Dániel Kántor <github@daniel-kantor.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kantord/tauler"
homepage = "https://kantord.github.io/tauler/"
rust-version = "1.96"

[workspace.dependencies]
optative = "=0.1.4"

[package]
name = "tauler"
description = "A JSX-based status bar for Linux: write your bar as a .jsx file, rendered natively on X11 and Wayland"
keywords = ["statusbar", "wayland", "x11", "jsx", "desktop"]
categories = ["gui", "command-line-utilities", "os::linux-apis"]
readme = "README.md"
edition = "2021"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
exclude = [
    "/docs",
    "/.github",
    "/assets",
    "/.cargo",
    "/CLAUDE.md",
    "/VISION.md",
    "/justfile",
    "/renovate.json",
    "/.pre-commit-config.yaml",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWSIIxAW8MOpS1/+qA/KhHpVtPwT58dU4A4YY0sw+DN02POargT6PDM0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
# Must match `optative-script`'s rquickjs major: a second version in the graph
# makes `Ctx`/`Error` types from the two copies fail to unify at the UI-component
# registration boundary. Bump only in lockstep with `optative-script`.
rquickjs = { version = "=0.14.0", features = ["loader"] }
rquickjs-serde = "=0.8.0"
# `svg-backend` is `tauler-screenshot`'s output path (`render_svg`); the bar itself
# rasterizes through the default raster backend.
takumi = { version = "=2.18.1", features = ["svg-backend"] }
# For `ImageBuffer`, the only way to build an `ImageSource` from raw pixels: the
# `takumi` facade re-exports it only behind its semver-exempt `unstable` feature.
takumi-core = { version = "=0.33.0", default-features = false }
# Not used directly: these pin `takumi`'s own backends. Their later patch releases
# moved to a newer `takumi-core`, so a lockfile-less resolve (`cargo install`,
# release-plz's semver check) gets two `takumi-core` copies and fails to compile.
# Keep these pinned in lockstep with `takumi` on every bump; dropping them reopens
# the two-`takumi-core` break for every already-published release.
takumi-raster = { version = "=0.5.10", default-features = false }
takumi-svg = { version = "=0.3.32", default-features = false }
x11rb = { version = "=0.14.0", features = ["randr"] }
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
json-canon = "=0.1.3"
# `import.meta.url` for every evaluated module: `from_file_path` does the
# percent-encoding a hand-built `file://` string gets wrong.
url = "=2.5.8"
anyhow = "=1.0.104"
serde_yaml = "=0.9.34"
# Must be the current workspace version, not a lower floor: `cargo publish
# --dry-run` prefers a registry copy over the local package whenever the
# requirement admits one, so a stale floor silently verifies `tauler` against
# the *published* macro. That is invisible until the two disagree — which is
# exactly what happened when the macro stopped hard-coding its tag list.
tauler-ui-macro = { path = "tauler-ui-macro", version = "0.1.16" }
# The wasm-clean subset, with the QuickJS half switched on. Same version pinning
# rationale as `tauler-ui-macro` above.
tauler-core = { path = "tauler-core", version = "0.3.9", features = ["quickjs"] }
tauler-configgen = { path = "tauler-configgen", version = "0.7.2" }
optative = "=0.1.4"
optative-process-pool = "=0.0.9"
optative-derive = "=0.0.4"
optative-script = "=0.0.13"
notify = "=8.2.1"
cached = { version = "=4.0.3", default-features = false }
tempfile = "=3.27.0"
minijinja = { version = "=3.0.3", features = ["serde"] }
# Checks the pinned sha256 of the files a D3Figure downloads (d3_figure/assets.rs).
sha2 = "=0.11.1"
# Unpacks d3's npm tarball, the only place d3 publishes its built file.
flate2 = "=1.1.10"
tar = "=0.4.46"
# Downloads d3 and linkedom on first use; blocking, HTTPS through rustls.
ureq = "=3.5.0"

# Kept off other platforms: Wayland's build scripts need pkg-config and
# libxkbcommon, and x11rb's `allow-unsafe-code` links libxcb.
[target.'cfg(target_os = "linux")'.dependencies]
accesskit = "=0.25.1"
accesskit_unix = "=0.24.0"
smithay-client-toolkit = "=0.21.1"
wayland-client = "=0.31.15"
x11rb = { version = "=0.14.0", features = ["allow-unsafe-code"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "=0.30.13"
softbuffer = "=0.4.8"

[dev-dependencies]
criterion = "=0.8.2"
image = "=0.25.10"
libc = "=0.2.191"
tracing-test = "=0.2.6"
rstest = "=0.28.0"

[[bench]]
name = "pipeline"
harness = false
