[workspace]
members = [".", "tauler-i3", "tauler-notify", "tauler-ui-macro", "tauler-docgen", "tauler-screenshot"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Dániel Kántor <github@daniel-kantor.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kantord/tauler"
homepage = "https://kantord.github.io/tauler/"
rust-version = "1.95"

[workspace.dependencies]
optative = "0.1.4"

[package]
name = "tauler"
description = "A JSX-based status bar for Linux: write your bar as a .jsx file, rendered natively on X11 and Wayland"
keywords = ["statusbar", "wayland", "x11", "jsx", "desktop"]
categories = ["gui", "command-line-utilities", "os::linux-apis"]
readme = "README.md"
edition = "2021"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
exclude = ["/docs", "/.github", "/assets"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Pinned to match `optative-script`'s rquickjs: a second version in the graph
# makes `Ctx`/`Error` types from the two copies fail to unify at the UI-component
# registration boundary. Bump only in lockstep with `optative-script`.
rquickjs = { version = "0.11", features = ["loader"] }
rquickjs-serde = "0.6.1"
takumi = "2.5.11"
# For `ImageBuffer`, the only way to build an `ImageSource` from raw pixels: the
# `takumi` facade re-exports it only behind its semver-exempt `unstable` feature.
takumi-core = { version = "0.16.0", default-features = false }
x11rb = { version = "0.14.0", features = ["randr"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
json-canon = "0.1.3"
anyhow = "1.0.104"
serde_yaml = "0.9.34"
tauler-ui-macro = { path = "tauler-ui-macro", version = "0.1.0" }
optative = "0.1.4"
optative-process-pool = "0.0.9"
optative-derive = "0.0.4"
optative-script = "0.0.8"
notify = "8.2.0"
cached = { version = "2.0.2", features = ["proc_macro"] }
tempfile = "3.27.0"

# Kept off other platforms: Wayland's build scripts need pkg-config and
# libxkbcommon, and x11rb's `allow-unsafe-code` links libxcb.
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = "0.21.1"
wayland-client = "0.31.15"
x11rb = { version = "0.14.0", features = ["allow-unsafe-code"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30.13"
softbuffer = "0.4.8"

[dev-dependencies]
image = "0.25.10"
libc = "0.2.189"
tracing-test = "0.2.6"
rstest = "0.26.1"
