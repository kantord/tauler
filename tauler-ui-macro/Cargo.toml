[package]
name = "tauler-ui-macro"
description = "Proc macro for declaring tauler UI components with JSX-like syntax"
keywords = ["tauler", "statusbar", "jsx", "macro"]
categories = ["development-tools::procedural-macro-helpers", "gui"]
readme = "README.md"
edition = "2021"
# Not `version.workspace = true`: this crate has no path dependents through
# release-plz's normal cycle-to-cycle changes, so lockstepping it with the
# rest of the workspace only sweeps its manifest version along on cycles
# where it has no commits of its own — exactly the state release-plz's own
# internal `cargo update` cannot reconcile before it even opens a release PR
# (release-plz/release-plz#2878). Versioning it independently means it moves
# only when release-plz decides *this* crate needs releasing, which is the
# one code path release-plz gets right: rewriting every dependent's
# `version = "..."` requirement to match.
version = "0.1.11"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
rstml = "0.13.0"
syn = { version = "3.0.3", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
