[package]
name = "tauler-screenshot"
description = "Renders a tauler JSX layout to a PNG, using the same pipeline as the bar itself"
keywords = ["tauler", "statusbar", "jsx", "screenshot", "rendering"]
categories = ["command-line-utilities", "visualization"]
readme = "README.md"
edition = "2021"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWSIIxAW8MOpS1/+qA/KhHpVtPwT58dU4A4YY0sw+DN02POargT6PDM0"

[[bin]]
name = "tauler-screenshot"
path = "src/main.rs"

[dependencies]
tauler = { path = "..", version = "0.1.2" }
clap = { version = "4.6.6", features = ["derive"] }
image = "0.25.10"
serde_json = "1.0.151"
