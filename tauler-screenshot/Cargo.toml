[package]
name = "tauler-screenshot"
description = "Renders a tauler JSX layout to a vector SVG, using the same pipeline as the bar itself"
keywords = ["tauler", "statusbar", "jsx", "screenshot", "rendering"]
categories = ["command-line-utilities", "visualization"]
readme = "README.md"
edition = "2021"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWSIIxAW8MOpS1/+qA/KhHpVtPwT58dU4A4YY0sw+DN02POargT6PDM0"

[[bin]]
name = "tauler-screenshot"
path = "src/main.rs"

[dependencies]
# Must be the current workspace version — see the note on `tauler-ui-macro` in the root
# manifest. A floor low enough to admit a published release makes `cargo publish
# --dry-run` verify this crate against *that* release instead of the local one, so any
# rename here compiles locally and fails in CI.
tauler = { path = "..", version = "0.2.4" }
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
