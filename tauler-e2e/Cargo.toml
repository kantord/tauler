[package]
name = "tauler-e2e"
description = "Internal tool: runs tauler against a real X11 + i3 desktop in a container"
edition = "2021"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "=1.0.104"
image = "=0.25.10"
serde_json = "=1.0.152"
testcontainers = { version = "=0.28.0", features = ["blocking"] }

[dev-dependencies]
# The scenarios build a terminal's colours from the same built-in theme the bar is told to use.
tauler-core = { path = "../tauler-core", version = "0.3.6" }
