<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Name the generic families for the e2e desktop.

  tauler asks fontconfig for `sans-serif` and `monospace` and registers whatever
  comes back (`load_targeted_fonts`). On a bare Debian the answer is Nimbus Sans
  and Nimbus Mono PS — URW's Helvetica and Courier clones, which arrive as a
  dependency of something else and win by default because nothing said
  otherwise. Every screenshot in this suite was then typeset in a Helvetica
  clone by accident.

  A real desktop has a session that states this. Here, this file is it.
-->
<!--
  Strong-bound <match> rules rather than <alias><prefer>. `prefer` emits a weak
  binding, and Debian's own 60-latin.conf already names its preferred families
  the same way; weak bindings lose to what is already in the list, so the alias
  loaded, parsed, and changed nothing.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrains Mono</string>
    </edit>
  </match>
</fontconfig>
