# Thermal — the one terminal that can be told to repaint itself.
#
# Every other window in this rice shows its crop of tauler's <wallpaper> through
# urxvt's pseudo-transparency, which is free but is the *same* image for
# everyone. kitty is here to test the other half of the brief's §3: a background
# that belongs to one window and changes at runtime.
#
# `allow_remote_control` plus `listen_on` is what makes that possible. Without
# both, `kitty @ set-background-image` has nothing to talk to.
allow_remote_control yes
listen_on unix:/tmp/kitty-thermal

font_family      JetBrains Mono
font_size        10.5

background       #120F1C
foreground       #F1E7E2
cursor           #F4D660

# No compositor, so this is a no-op — kept at 1.0 rather than left to look like
# it might do something. Real alpha on a toplevel needs an ARGB visual and
# something to composite it.
background_opacity 1.0

# The initial plate. `scaled` stretches it to the window; the file is 8px wide
# on purpose, so the horizontal stretch costs nothing and only the vertical ramp
# is doing any work.
background_image /root/.local/share/thermal/heat-0.png
background_image_layout scaled
background_image_linear yes

# The background must not wash out the text. `background_tint` dims the image
# behind cells that have text in them, which is the only legibility control
# kitty offers here.
background_tint 0.55

window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# Nothing about this window should move between two runs of the scenario.
cursor_blink_interval 0
