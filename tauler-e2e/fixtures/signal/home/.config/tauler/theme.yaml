# Signal — maritime code.
#
# navy #10182C · ground #1A2038 · bone #E9E7DC · oxide #B04A3A ·
# signal #DFB22E · sea #3A74B0
#
# The flag colours are not theme tokens on purpose. A flag's two colours are
# picked by a hash at render time, so they have to be values the layout file can
# index — see INK in layout.op.mdx. The tokens here dress the bar around them.
name: signal
mode: dark
colors:
  background: "#10182C"
  foreground: "#E9E7DC"

  card: "#1A2038e6"
  card-foreground: "#E9E7DC"
  popover: "#1A2038"
  popover-foreground: "#E9E7DC"

  primary: "#DFB22E"
  primary-foreground: "#10182C"
  secondary: "#1A2038"
  secondary-foreground: "#E9E7DC"

  muted: "#1A2038"
  muted-foreground: "#7F8AA6"
  accent: "#3A74B0"
  accent-foreground: "#E9E7DC"
  destructive: "#B04A3A"

  border: "#E9E7DC26"
  input: "#E9E7DC26"
  ring: "#DFB22E"

  chart-1: "#DFB22E"
  chart-2: "#3A74B0"
  chart-3: "#B04A3A"
  chart-4: "#E9E7DC"
  chart-5: "#7F8AA6"

  sidebar: "#1A2038"
  sidebar-foreground: "#E9E7DC"
  sidebar-primary: "#DFB22E"
  sidebar-primary-foreground: "#10182C"
  sidebar-accent: "#1A2038"
  sidebar-accent-foreground: "#E9E7DC"
  sidebar-border: "#E9E7DC26"
  sidebar-ring: "#DFB22E"

  # tauler: terminal colours — a shared placeholder, not part of this rice
  destructive-foreground: "#E9E7DC"
  ansi-black: "#000000"
  ansi-red: "#cc0000"
  ansi-green: "#4e9a06"
  ansi-yellow: "#c4a000"
  ansi-blue: "#3465a4"
  ansi-magenta: "#75507b"
  ansi-cyan: "#06989a"
  ansi-white: "#d3d7cf"
  ansi-bright-black: "#555753"
  ansi-bright-red: "#ef2929"
  ansi-bright-green: "#8ae234"
  ansi-bright-yellow: "#fce94f"
  ansi-bright-blue: "#729fcf"
  ansi-bright-magenta: "#ad7fa8"
  ansi-bright-cyan: "#34e2e2"
  ansi-bright-white: "#eeeeec"

radius:
  sm: "2px"
  md: "3px"
  lg: "4px"
  xl: "5px"
  2xl: "6px"
  3xl: "8px"
  4xl: "10px"
