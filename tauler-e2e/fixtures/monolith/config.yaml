# Monolith III wants two typefaces: a Didone serif for folios and numerals, a
# mono for everything functional. tauler registers exactly three generic
# families — sans-serif, monospace, emoji — plus whatever `fonts.primary` names,
# and a layout file cannot name a fourth. There is no `serif` slot.
#
# So the serif takes the sans-serif slot. `fontFamily: "monospace"` in the
# layout file still reaches JetBrains Mono (the image's fonts.conf names it),
# and every unstyled node inherits the serif. Two typefaces, one of them living
# under the wrong generic name.
#
# Nimbus Roman is a Times clone, not a Didone. The image ships no high-contrast
# serif at all — see the report for what that costs the design.
theme:
  mode: dark
  file: /fixtures/monolith/theme.yaml

fonts:
  primary: Nimbus Roman
