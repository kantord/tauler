[package]
name = "tauler-docgen"
description = "Internal tool: generates the tauler component documentation pages"
edition = "2021"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tauler-docgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
image = "0.25.10"
insta = "1.48.0"
