[package]
name = "tauler-docgen"
description = "Internal tool: generates the tauler component documentation pages"
edition = "2021"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tauler-docgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
# For the component table and the ES-module shims it generates. The `quickjs` feature is
# off: this binary only reads metadata, it never registers anything into a realm.
tauler-core = { path = "../tauler-core" }
# The same JSX transform the desktop runs, so the browser never needs one (ADR 0025).
optative-script = "0.0.9"

[dev-dependencies]
tempfile = "3.27.0"
image = "0.25.10"
insta = "1.48.0"
