[package]
name = "tauler-i3"
description = "i3 and sway workspace data source for the tauler status bar"
keywords = ["tauler", "statusbar", "i3", "sway", "ipc"]
categories = ["command-line-utilities", "os::linux-apis"]
readme = "README.md"
edition = "2024"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWSIIxAW8MOpS1/+qA/KhHpVtPwT58dU4A4YY0sw+DN02POargT6PDM0"

[dependencies]
serde_json = "1.0.151"
swayipc = "4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
