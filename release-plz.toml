[workspace]
# Works around a gitoxide slotmap overflow (GitoxideLabs/gitoxide#1788) that
# crashes release-plz during index polling. The release workflow publishes.
publish = false

# TEMPORARY: re-enable (delete this line) once the first release after the takumi
# update has been tagged. cargo-semver-checks builds the previous release tag with a
# fresh resolve that ignores Cargo.lock, and the pre-update tags no longer compile
# (exact `takumi` pin vs. floating transitive crates). A newer tag fixes the baseline.
semver_check = false

# Breaks the version bump loop (release-plz#1181), where the "chore: release"
# commit's own Cargo.toml changes read as unreleased work.
release_commits = "^(feat|fix|refactor|perf|build)"

[[package]]
name = "tauler"
version_group = "tauler"

[[package]]
name = "tauler-i3"
version_group = "tauler"

[[package]]
name = "tauler-notify"
version_group = "tauler"

[[package]]
name = "tauler-aerospace"
version_group = "tauler"

[[package]]
name = "tauler-screenshot"
version_group = "tauler"

[[package]]
name = "tauler-accumulate"
version_group = "tauler"

[[package]]
name = "tauler-configgen"
version_group = "tauler"

# Deliberately NOT in the "tauler" version_group: `tauler` and `tauler-core` depend on
# it by path *and* version, and lockstepping its version with the rest of the workspace
# means release-plz moves its manifest version even on cycles with no commits of its
# own -- see the comment on its `version` field in tauler-ui-macro/Cargo.toml.
[[package]]
name = "tauler-ui-macro"

[[package]]
name = "tauler-docgen"
release = false
