allowBuilds:
  # A native file watcher Tailwind pulls in for its `--watch` mode. The docs build never
  # watches, so the prebuilt fallback is all that is needed and `pnpm install` stops
  # exiting non-zero over an undecided entry.
  '@parcel/watcher': false
  esbuild: true
  sharp: true
# A version has to be three days old before it is installed (Renovate waits
# the same). Strict: a too-new version fails the install instead of being
# swapped for an older one in silence.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
