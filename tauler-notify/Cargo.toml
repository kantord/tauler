[package]
name = "tauler-notify"
description = "Desktop notification (D-Bus) data source for the tauler status bar"
keywords = ["tauler", "statusbar", "notifications", "dbus", "freedesktop"]
categories = ["command-line-utilities", "os::linux-apis"]
readme = "README.md"
edition = "2021"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
zbus = { version = "5.18.0", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
