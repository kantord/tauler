[package]
name = "tauler-core"
description = "The part of tauler that draws nothing: UI components, the theme layer, and the DOM walk"
keywords = ["tauler", "statusbar", "jsx", "components", "wasm"]
categories = ["gui", "wasm"]
edition = "2021"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# This crate is the wasm-clean subset (ADR 0010, "The third measurement"). It must never
# gain a dependency that cannot build for `wasm32-unknown-unknown` outside the `quickjs`
# feature — x11rb, smithay, takumi and rquickjs all belong on the far side of that line.
# `cargo check -p tauler-core --target wasm32-unknown-unknown` is what enforces it.

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tauler-ui-macro = { path = "../tauler-ui-macro", version = "0.1.12" }
# The Unit reconciler's diff core (units_reconcile.rs): pure, no QuickJS, so it
# belongs here rather than behind the `quickjs` feature — a browser Unit needs
# the same diffing native Units get (ADR 0037).
optative = "=0.1.4"

# The QuickJS half: registration, the `EsEntry` table and `UiComponent::js_fn`. Enabled by
# `tauler`, never by the web build — `rquickjs-sys` compiles QuickJS from C and there is no
# wasm32-unknown-unknown sysroot for it (ADR 0025).
rquickjs = { version = "=0.12.2", features = ["loader"], optional = true }
rquickjs-serde = { version = "=0.6.1", optional = true }
optative-script = { version = "=0.0.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned exactly: the `wasm-bindgen` CLI refuses to process a module built against a
# different version of the crate, so the two are one version number in two places.
# CI installs `wasm-bindgen-cli` at this same version.
wasm-bindgen = "=0.2.127"
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
rstest = "0.26.1"

[features]
default = []
quickjs = ["dep:rquickjs", "dep:rquickjs-serde", "dep:optative-script"]
