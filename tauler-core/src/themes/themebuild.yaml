# What `cargo run -p tauler-core --example build_themes` generates.
#
# TERM: **Workload** — one entry below: which Neovim colour scheme to read, at which commit.
#   Each produces one built-in theme in `themes/<name>/`.
#   Avoid: preset, import (nothing here is imported at runtime; the output is committed).
#
# DECISION: one extraction for every scheme — a Neovim that has loaded the scheme is asked the
#   questions in `generate/queries.yaml` and each answer is a token's colour. There is no
#   per-scheme code, so adding a scheme is a workload entry, not a generator. A scheme whose
#   answers fall short of the contrast floor is fixed with `queries:` below, one token at a time, or
#   not shipped. Rejected: deriving the colours from a seed and repairing them (the previous
#   design): it could ship any scheme but with colours that were no longer the scheme's own.
#
# DECISION: every style a scheme ships is its own workload and its own theme, and the theme's
#   mode is the page colour's: dark if it is closer in contrast to black than to white, whatever
#   the scheme says `&background` is. One theme is one mode (see `Theme`).
#
# DECISION: each workload runs in a headless Neovim started with `--clean` against a fresh
#   checkout in a temp dir, so the output depends on the pinned commit and the queries, never on
#   whoever ran the build's own Neovim config or plugins.
#
# DECISION: Apache-2.0 schemes are fine to ship. Each theme folder carries the upstream licence
#   verbatim and its theme.yaml header states the source commit. Rejected: MIT/BSD only — it
#   would exclude tokyonight.
#
# Fields: `colorscheme`; `background` (default dark) is only a hint for schemes that branch on
#   &background; `setup` is Lua run before the scheme loads, for one that must be configured to
#   answer; `queries` maps a token to a query that replaces the table's for this scheme.
#
# SPEC: `rev` is a full commit, never a branch or tag — the output must be reproducible.
themes:
  - name: tokyonight-night
    repo: https://github.com/folke/tokyonight.nvim
    rev: cdc07ac78467a233fd62c493de29a17e0cf2b2b6
    license: Apache-2.0
    colorscheme: tokyonight-night
    # tokyonight's comment colour is 2.8:1 on its page; `Conceal` is its quiet colour that is not.
    queries:
      muted-foreground: Conceal.fg
  - name: tokyonight-storm
    repo: https://github.com/folke/tokyonight.nvim
    rev: cdc07ac78467a233fd62c493de29a17e0cf2b2b6
    license: Apache-2.0
    colorscheme: tokyonight-storm
    queries:
      muted-foreground: Conceal.fg
  - name: tokyonight-moon
    repo: https://github.com/folke/tokyonight.nvim
    rev: cdc07ac78467a233fd62c493de29a17e0cf2b2b6
    license: Apache-2.0
    colorscheme: tokyonight-moon
  - name: tokyonight-day
    repo: https://github.com/folke/tokyonight.nvim
    rev: cdc07ac78467a233fd62c493de29a17e0cf2b2b6
    license: Apache-2.0
    colorscheme: tokyonight-day
    # Its default panel colour leaves no quiet text colour that reads on it; the floating-window
    # colour does.
    queries:
      card: NormalFloat.bg
      secondary: NormalFloat.bg
      muted-foreground: Conceal.fg
  - name: catppuccin-mocha
    repo: https://github.com/catppuccin/nvim
    rev: edefef779ab08ce1a4a404713e3012b0d202bd35
    license: MIT
