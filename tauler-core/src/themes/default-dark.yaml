# DECISION: the default has chromatic ANSI colours (the Tango palette) although every other
# token is chroma 0. The 16 terminal colours are meaningless as greys, and they are only read
# through `ansi-*`, never by the bar's own components, so the grey bar stays grey.
#
# DECISION: the dark default is Tango's own palette and the light default its darker shades, so
# the colours stay legible on a light background. (`ansi-white` is a light grey in the light
# default, as terminal light themes do.)
name: default-dark
mode: dark
colors:
  background: "oklch(0.145 0 0)"
  foreground: "oklch(0.985 0 0)"
  card: "oklch(0.205 0 0)"
  card-foreground: "oklch(0.985 0 0)"
  popover: "oklch(0.205 0 0)"
  popover-foreground: "oklch(0.985 0 0)"
  primary: "oklch(0.922 0 0)"
  primary-foreground: "oklch(0.205 0 0)"
  secondary: "oklch(0.269 0 0)"
  secondary-foreground: "oklch(0.985 0 0)"
  muted: "oklch(0.269 0 0)"
  muted-foreground: "oklch(0.708 0 0)"
  accent: "oklch(0.269 0 0)"
  accent-foreground: "oklch(0.985 0 0)"
  destructive: "oklch(0.704 0.191 22.216)"
  border: "oklch(1 0 0 / 10%)"
  input: "oklch(1 0 0 / 15%)"
  ring: "oklch(0.556 0 0)"
  chart-1: "oklch(0.488 0.243 264.376)"
  chart-2: "oklch(0.696 0.17 162.48)"
  chart-3: "oklch(0.769 0.188 70.08)"
  chart-4: "oklch(0.627 0.265 303.9)"
  chart-5: "oklch(0.645 0.246 16.439)"
  sidebar: "oklch(0.205 0 0)"
  sidebar-foreground: "oklch(0.985 0 0)"
  sidebar-primary: "oklch(0.488 0.243 264.376)"
  sidebar-primary-foreground: "oklch(0.985 0 0)"
  sidebar-accent: "oklch(0.269 0 0)"
  sidebar-accent-foreground: "oklch(0.985 0 0)"
  sidebar-border: "oklch(1 0 0 / 10%)"
  sidebar-ring: "oklch(0.556 0 0)"
  destructive-foreground: "oklch(0.145 0 0)"
  ansi-black: "#000000"
  ansi-red: "#cc0000"
  ansi-green: "#4e9a06"
  ansi-yellow: "#c4a000"
  ansi-blue: "#3465a4"
  ansi-magenta: "#75507b"
  ansi-cyan: "#06989a"
  ansi-white: "#d3d7cf"
  ansi-bright-black: "#555753"
  ansi-bright-red: "#ef2929"
  ansi-bright-green: "#8ae234"
  ansi-bright-yellow: "#fce94f"
  ansi-bright-blue: "#729fcf"
  ansi-bright-magenta: "#ad7fa8"
  ansi-bright-cyan: "#34e2e2"
  ansi-bright-white: "#eeeeec"

radius:
  sm: "0.375rem"
  md: "0.5rem"
  lg: "0.625rem"
  xl: "0.875rem"
  2xl: "1.125rem"
  3xl: "1.375rem"
  4xl: "1.625rem"
